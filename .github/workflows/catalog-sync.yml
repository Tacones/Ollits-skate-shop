name: Sync Osso catalog

on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-osso-catalog.mjs'
      - 'src/data/catalog-schema.ts'
      - 'package.json'
      - '.github/workflows/catalog-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import Osso catalog
        run: npm run catalog:import
      - name: Commit refreshed supplier snapshot
        run: |
          if git diff --quiet -- src/data/import/supplier-catalog.json; then
            echo "Catalog snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/import/supplier-catalog.json
          git commit -m "chore(catalog): refresh Osso supplier snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
